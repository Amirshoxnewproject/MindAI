[data-theme=light]{--bg:#f4f4f5;--bg2:#fff;--card:#fff;--tx:#0a0a0a;--mu:#52525b;--bd:rgba(0,0,0,.12);--p:#27272a;--b:#52525b;--c:#71717a;--btx:#fff;--g:linear-gradient(135deg,#0a0a0a,#52525b)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:16px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden;animation:in .45s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.wrap{max-width:1180px;margin:auto;padding:0 20px}section{padding:60px 0}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.08;letter-spacing:-.02em}h2{font-size:clamp(1.5rem,3.5vw,2.2rem);margin-bottom:22px}
.grad{background:var(--g);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
@keyframes gs{to{background-position:200% 0}}
.mu{color:var(--mu)}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;height:64px;gap:16px}.logo{font-weight:800;font-size:1.35rem}
.nav nav{display:flex;gap:4px;margin-left:auto;align-items:center}.nav nav a{padding:8px 12px;border-radius:8px;color:var(--mu)}.nav nav a:hover,.nav nav a.act{color:var(--tx)}
.burger{display:none;margin-left:auto;background:none;border:0;color:var(--tx);font-size:1.7rem;min-width:44px;min-height:44px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border-radius:12px;border:0;background:var(--g);color:var(--btx)!important;font:600 1rem inherit;cursor:pointer;min-height:44px;box-shadow:0 0 22px rgba(209,213,219,.4);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(243,244,246,.45)}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)!important;box-shadow:none}.btn.sm{padding:8px 14px;min-height:38px;font-size:.88rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:var(--p);box-shadow:0 10px 36px rgba(209,213,219,.2)}
.glass{background:rgba(255,255,255,.04);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tool{display:flex;flex-direction:column;gap:8px}.tool p{color:var(--mu);font-size:.92rem;flex:1}.ico{font-size:2rem;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--bg2)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--mu)}.tag{padding:2px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--bd)}
.tag.free{color:#4ade80}.tag.paid{color:#fbbf24}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fav{margin-left:auto;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:10px;width:40px;height:38px;cursor:pointer;font-size:1.1rem}.fav.on{color:#f43f5e;border-color:#f43f5e}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font:inherit;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(209,213,219,.25)}
label{display:block;margin:14px 0 6px;font-size:.9rem;color:var(--mu)}.err{color:#f87171;font-size:.82rem;min-height:1em}
.hero{position:relative;text-align:center;padding:90px 0 60px;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;filter:blur(110px);opacity:.35;z-index:-1;animation:fl 12s ease-in-out infinite alternate}
.hero::before{background:var(--p);top:-120px;left:-100px}.hero::after{background:var(--c);bottom:-200px;right:-120px;animation-delay:-6s}
@keyframes fl{to{transform:translate(60px,40px)}}
.float{position:absolute;font-size:2rem;opacity:.5;animation:fl 7s ease-in-out infinite alternate}
.search{display:flex;gap:10px;max-width:620px;margin:28px auto 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;text-align:center}.stats b{font-size:2rem;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{padding:10px 18px;border-radius:99px;background:var(--card);border:1px solid var(--bd);cursor:pointer}.chip:hover{border-color:var(--c)}
footer{border-top:1px solid var(--bd);background:var(--bg2);padding:40px 0 20px;margin-top:40px}.fgrid{display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between}.fgrid a{display:block;color:var(--mu);padding:3px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:100;padding:16px;animation:in .2s}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:26px;max-width:520px;width:100%;max-height:90vh;overflow:auto;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:grid;gap:8px}.toast{padding:12px 18px;border-radius:12px;background:var(--card);border:1px solid var(--c);animation:in .3s}.toast.bad{border-color:#f87171}
.spin{width:18px;height:18px;border:3px solid var(--bd);border-top-color:var(--c);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}
@media(max-width:860px){.burger{display:block}.nav nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg2);padding:12px 20px;border-bottom:1px solid var(--bd)}.nav nav.open{display:flex}.search{flex-direction:column}.float{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.ico img{width:34px;height:34px;border-radius:8px;object-fit:contain}

.float{opacity:.8;width:48px;height:48px;border-radius:12px;object-fit:contain}.logo{display:inline-flex;align-items:center;gap:9px}
.tool .row{flex-wrap:nowrap}.tool .btn.sm{padding:8px 12px;white-space:nowrap}@media(max-width:380px){.tool .row{flex-wrap:wrap}}
.wrap{max-width:1280px}.grid{grid-template-columns:repeat(4,1fr)}.tool .btn.sm{font-size:.82rem;padding:8px 10px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.tool .row{flex-wrap:wrap}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}

@keyframes pg{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#main.pt{animation:pg .2s ease-out}

section{scroll-margin-top:70px}

.toggle{margin:22px 0 30px}.seg{display:inline-flex;gap:4px;padding:5px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}
.seg button{border:0;background:none;color:var(--mu);font:600 1.05rem inherit;padding:12px 30px;min-height:48px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg button small{font-size:.75rem;font-weight:600;color:var(--c);margin-left:6px}.seg button.on small{color:#fff}
.seg button.on{background:var(--g);color:#fff;box-shadow:0 0 22px rgba(209,213,219,.45)}.seg button:not(.on):hover{color:var(--tx)}
.plan{display:flex;flex-direction:column}.plan ul{flex:1}
@media(max-width:480px){.seg button{padding:10px 16px;font-size:.95rem}.seg button small{display:none}}

.authbox{max-width:440px;margin:50px auto;padding:34px 30px;text-align:center}.authbox:hover{transform:none}.authbox h1{font-size:1.9rem;margin:14px 0 6px}.authbox form{text-align:left;margin-top:18px}
.sbtn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;padding:13px;margin-top:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font:600 1rem inherit;cursor:pointer;min-height:48px;transition:border-color .2s}
.sbtn:hover:not(:disabled){border-color:var(--p)}.sbtn:disabled{opacity:.6;cursor:not-allowed}.sbtn img{width:20px;height:20px}
.sbtn.main{background:linear-gradient(180deg,#34374a,#1b1d29);color:#fff;border-color:transparent;margin-top:24px}
.sbtn em{font-style:normal;font-size:.7rem;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.15)}
.or{display:flex;align-items:center;gap:12px;color:var(--mu);margin:16px 0 4px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}

.logoimg{border-radius:9px;display:block}.lg{border-radius:22px;display:block;margin:0 auto}.logo{gap:10px}.seg button.on,.seg button.on small{color:var(--btx)}
.dash{display:grid;grid-template-columns:230px 1fr;gap:24px;padding:28px 0}
.side{display:grid;gap:4px;align-content:start;position:sticky;top:80px;height:max-content}.side a,.side button{padding:11px 14px;border-radius:10px;color:var(--mu);background:none;border:0;text-align:left;font:inherit;cursor:pointer}.side a:hover,.side a.act,.side button:hover{background:var(--card);color:var(--tx)}
.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.plan.hot{border-color:var(--p);box-shadow:0 0 40px rgba(209,213,219,.25)}.amt{font-size:2.6rem;font-weight:800}.plan ul{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px}.plan li::before{content:"✓ ";color:var(--c)}
.toggle{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:26px}.toggle input{width:auto;min-height:0}
.form{max-width:440px;margin:50px auto}.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .3s}
.pw{position:relative}.pw button{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--mu);cursor:pointer;min-height:36px;min-width:36px}
.note{padding:10px 14px;border-radius:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);font-size:.88rem;margin:14px 0}
.chat{display:grid;grid-template-columns:220px 1fr;gap:16px;height:72vh;min-height:420px}.chat>div{display:flex;flex-direction:column;overflow:hidden;padding:14px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}.msg{max-width:82%;padding:10px 14px;border-radius:14px;background:var(--bg2);white-space:pre-wrap;overflow-wrap:anywhere}.msg.me{align-self:flex-end;background:var(--p);color:var(--btx)}.msg small{display:block;margin-top:4px;opacity:.7;cursor:pointer}
#hist button{display:block;width:100%;text-align:left;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
